[package]
name = "mona-resource-studio"
version = "0.1.4"
description = "Collaborative Minecraft resource pack IDE"
authors = ["MONAKA SERVER"]
edition = "2021"

[lib]
name = "mona_resource_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
