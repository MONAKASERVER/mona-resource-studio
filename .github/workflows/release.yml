name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles nsis

      - name: Create signed updater manifest and checksums
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $out = ".release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $installer = Get-ChildItem "$bundle/*.exe" | Select-Object -First 1
          $updater = Get-ChildItem "$bundle/*.nsis.zip" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          if (-not $updater -or -not (Test-Path "$($updater.FullName).sig")) { throw "Signed NSIS updater bundle was not generated." }
          Copy-Item $installer.FullName "$out/$($installer.Name)"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$out/$($installer.Name).sha256"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $updaterName = "Mona.Resource.Studio_${version}_x64.nsis.zip"
          Copy-Item $updater.FullName "$out/$updaterName"
          Copy-Item "$($updater.FullName).sig" "$out/$updaterName.sig"
          $manifest = [ordered]@{
            version = $version
            notes = "Mona Resource Studio $($env:GITHUB_REF_NAME)"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$($updater.FullName).sig" -Raw).Trim()
                url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:GITHUB_REF_NAME)/$updaterName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM "$out/latest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mona Resource Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Windows向けMona Resource Studioインストーラーです。

            - `.exe`: NSISインストーラー
            - `.sha256`: SHA-256チェックサム
            - `latest.json` / `.nsis.zip`: アプリ内自動更新用の署名済みデータ
            - 現在の配布バイナリは未署名です。Windows SmartScreenが表示された場合は、発行元とチェックサムを確認してください。
          files: |
            .release/*
